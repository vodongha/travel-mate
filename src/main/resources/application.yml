spring:
  application:
    name: travel-mate
  datasource:
    # Provided via environment (see CLAUDE.md "No secrets in code"); Oracle ADB in prod,
    # a Testcontainers-managed Oracle Free instance in integration tests.
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Never `update` — schema is owned by Flyway. `validate` asserts entities match the DB.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # Oracle TIMESTAMP carries no zone; store everything UTC (SPEC §2.5).
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8000}

app:
  # Public base URL of the deployed app — used to build invite/email links. Override per
  # environment (prod sets https://trippo.io.vn); defaults to the local dev server.
  public-url: ${APP_PUBLIC_URL:http://localhost:8000}
  jwt:
    # Override in every real environment via JWT_SECRET. The fallback is a clearly-insecure
    # dev/test placeholder (>= 32 bytes for HS256), never a real secret.
    secret: ${JWT_SECRET:dev-insecure-placeholder-secret-override-me-0123456789}
    # Long-lived access token so the app stays signed in (override via JWT_ACCESS_TTL, ISO-8601
    # duration). 30 days; paired with a 1-year refresh token below.
    access-ttl: ${JWT_ACCESS_TTL:PT720H}
    issuer: travel-mate
  google:
    # The project's **Web** OAuth client id — must equal the app's serverClientId so the Google ID
    # token's `aud` matches. Public value (safe as a default); override with env GOOGLE_CLIENT_ID.
    client-id: ${GOOGLE_CLIENT_ID:542406829306-4f37t1brg750jdoksjidh197hkbopnuj.apps.googleusercontent.com}
  cors:
    # Comma-separated origin whitelist (no '*' with credentials). Empty = no browser origins
    # allowed (native mobile clients don't send Origin and are unaffected).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  fcm:
    # When true, the Firebase Admin SDK sends real pushes (needs a service account). When false
    # (dev/test default), the LoggingFcmSender just logs — the pipeline still runs.
    enabled: ${FCM_ENABLED:false}
    # The service-account JSON content (inline). On Fly set FCM_CREDENTIALS to the file's contents.
    # Empty falls back to Application Default Credentials (GOOGLE_APPLICATION_CREDENTIALS).
    credentials: ${FCM_CREDENTIALS:}
  ops:
    # Admin "Ops & libs" page: which repos/refs to read pom.xml + pubspec.yaml from, and a GitHub
    # token (read-only, scope security_events) to list Dependabot alerts. Token blank = alerts off.
    backend-repo: ${OPS_BACKEND_REPO:vodongha/travel-mate}
    backend-ref: ${OPS_BACKEND_REF:master}
    app-repo: ${OPS_APP_REPO:vodongha/travel-mate-app}
    app-ref: ${OPS_APP_REF:master}
    github-token: ${OPS_GITHUB_TOKEN:}
  auth:
    # Keep the session alive for a year (override via AUTH_REFRESH_TTL_DAYS).
    refresh-ttl-days: ${AUTH_REFRESH_TTL_DAYS:365}
    email-verify-ttl-hours: 24
    password-reset-ttl-hours: 1
  request:
    max-body-bytes: 1048576        # 1 MiB hard cap on request bodies
  ratelimit:
    capacity: 30                   # max requests per window per IP on /auth/*
    window-seconds: 60

logging:
  level:
    org.flywaydb: info
