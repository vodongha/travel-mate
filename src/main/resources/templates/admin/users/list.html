<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Users')}"></head>
<body>
<div class="layout">
  <div th:replace="~{admin/fragments :: sidebar('users')}"></div>
  <main class="main">
    <div th:replace="~{admin/fragments :: header('Manage', 'Users')}"></div>

    <div th:replace="~{admin/fragments :: dtToolbar(${table})}"></div>

    <table>
      <thead>
        <tr>
          <th th:replace="~{admin/fragments :: dtSortTh(${table}, 'Email', 'email')}"></th>
          <th th:replace="~{admin/fragments :: dtSortTh(${table}, 'Name', 'name')}"></th>
          <th>Status</th>
          <th>Provider</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="u : ${table.page.content}">
          <td><a th:href="@{/admin/users/{rid}(rid=${u.rid})}" th:text="${u.email}">e@x.com</a></td>
          <td th:text="${u.name}">Name</td>
          <td>
            <span th:if="${u.superadmin}" class="badge brand">Admin</span>
            <span th:if="${u.disabled}" class="badge danger">Disabled</span>
            <span th:if="${!u.superadmin and !u.disabled}" class="badge">Active</span>
          </td>
          <td th:text="${u.provider}">LOCAL</td>
        </tr>
        <tr th:if="${table.page.totalElements == 0}">
          <td colspan="4" class="muted">No users match.</td>
        </tr>
      </tbody>
    </table>

    <div th:replace="~{admin/fragments :: dtPager(${table})}"></div>
    <div th:replace="~{admin/fragments :: footer}"></div>
  </main>
</div>
</body>
</html>
