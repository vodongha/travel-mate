<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Trip')}"></head>
<body>
<div class="layout">
  <div th:replace="~{admin/fragments :: sidebar('trips')}"></div>
  <div class="content">
    <div th:replace="~{admin/fragments :: header('Manage', ${t.name})}"></div>
    <main class="main">

    <div th:replace="~{admin/fragments :: tripTabs(${t}, ${activeTab})}"></div>

    <div th:if="${flash}" class="flash" th:classappend="${flashType}" th:text="${flash}">message</div>

    <div class="panel" style="max-width:560px">
      <h2>Trip</h2>
      <dl class="kv">
        <dt>Name</dt><dd th:text="${t.name}">Trip</dd>
        <dt>Destination</dt><dd th:text="${t.destination} ?: '—'">—</dd>
        <dt>Dates</dt><dd><span th:text="${t.startDate} ?: '—'">—</span> → <span th:text="${t.endDate} ?: '—'">—</span></dd>
        <dt>Type</dt><dd th:text="${t.tripType}">OTHER</dd>
        <dt>Base currency</dt><dd th:text="${t.baseCurrency}">VND</dd>
        <dt>Members</dt><dd th:text="${memberCount}">0</dd>
        <dt>Created</dt><dd th:text="${t.createdAt}">—</dd>
        <dt>Rid</dt><dd th:text="${t.rid}">—</dd>
      </dl>
      <hr>
      <h2>Edit</h2>
      <form th:action="@{/admin/trips/{rid}/edit(rid=${t.rid})}" method="post">
        <label>Name<input type="text" name="name" th:value="${t.name}" required></label>
        <label>Destination<input type="text" name="destination" th:value="${t.destination}"></label>
        <label>Start date<input type="date" name="startDate" th:value="${t.startDate}"></label>
        <label>End date<input type="date" name="endDate" th:value="${t.endDate}"></label>
        <label>Type
          <select name="tripType">
            <option th:each="ty : ${T(com.travelmate.trip.TripType).values()}"
                    th:value="${ty}" th:text="${ty}" th:selected="${ty == t.tripType}">OTHER</option>
          </select>
        </label>
        <button class="btn brand" type="submit">Save changes</button>
      </form>
      <hr>
      <form th:action="@{/admin/trips/{rid}/delete(rid=${t.rid})}" method="post"
            onsubmit="return confirm('Delete this trip? It is hidden from all members.');">
        <button class="btn danger" type="submit">Delete trip</button>
      </form>
    </div>

    </main>


    <div th:replace="~{admin/fragments :: footer}"></div>
  </div>
</div>
</body>
</html>
