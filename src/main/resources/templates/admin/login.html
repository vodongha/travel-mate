<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Sign in')}"></head>
<body class="login-body">
  <form class="login-card" th:action="@{/admin/login}" method="post">
    <h1>Trippo Admin</h1>
    <p th:if="${param.error}" class="flash error">Invalid email or password.</p>
    <p th:if="${param.logout}" class="flash ok">You have been signed out.</p>
    <label>Email
      <input type="email" name="email" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button class="primary" type="submit">Sign in</button>
  </form>
</body>
</html>
