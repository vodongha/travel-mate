<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Ops & libs')}"></head>
<body>
<div class="layout">
  <div th:replace="~{admin/fragments :: sidebar('ops')}"></div>
  <main class="main">
    <div th:replace="~{admin/fragments :: header('System', 'Ops & libs')}"></div>

    <div th:if="${flash}" class="flash" th:classappend="${flashType}" th:text="${flash}">message</div>

    <div class="toolbar">
      <span class="muted" th:if="${snapshot}">
        Last checked: <span th:text="${snapshot.checkedAt}">—</span>
      </span>
      <span class="muted" th:unless="${snapshot}">Not checked yet — run a refresh.</span>
      <div style="flex:1"></div>
      <form method="post" th:action="@{/admin/ops/refresh}">
        <button class="primary" type="submit">Refresh now</button>
      </form>
    </div>

    <div th:if="${snapshot}">
      <div th:if="${!snapshot.errors.isEmpty()}" class="flash error">
        <div th:each="e : ${snapshot.errors}" th:text="${e}">error</div>
      </div>

      <div class="cards">
        <a class="card" th:href="@{/admin/ops/maven}">
          <div class="label">Backend libs (Maven)</div>
          <div class="value" th:text="${#lists.size(snapshot.maven)}">0</div>
        </a>
        <a class="card" th:href="@{/admin/ops/pub}">
          <div class="label">App libs (pub.dev)</div>
          <div class="value" th:text="${#lists.size(snapshot.pub)}">0</div>
        </a>
        <a class="card" th:href="@{/admin/ops/alerts}">
          <div class="label">Dependabot alerts</div>
          <div class="value" th:text="${snapshot.dependabotConfigured} ? ${#lists.size(snapshot.alerts)} : '—'">0</div>
        </a>
      </div>
      <p class="muted" th:unless="${snapshot.dependabotConfigured}" style="margin-top:14px">
        Set <code>OPS_GITHUB_TOKEN</code> to enable Dependabot alerts.
      </p>
    </div>
    <div th:replace="~{admin/fragments :: footer}"></div>
  </main>
</div>
</body>
</html>
