<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Audit log')}"></head>
<body>
<div class="layout">
  <div th:replace="~{admin/fragments :: sidebar('audit')}"></div>
  <main class="main">
    <div th:replace="~{admin/fragments :: header('System', 'Audit log')}"></div>

    <div th:replace="~{admin/fragments :: dtToolbar(${table})}"></div>

    <table>
      <thead>
        <tr>
          <th th:replace="~{admin/fragments :: dtSortTh(${table}, 'When', 'createdAt')}"></th>
          <th>Admin</th>
          <th th:replace="~{admin/fragments :: dtSortTh(${table}, 'Action', 'action')}"></th>
          <th>Target</th>
          <th>Detail</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="e : ${table.page.content}">
          <td th:text="${e.createdAt}">2026-01-01T00:00:00Z</td>
          <td th:text="${actors.get(e.actorUserId)} ?: '—'">admin@x.com</td>
          <td><span class="badge" th:text="${e.action}">ACTION</span></td>
          <td th:text="${e.targetType} + (${e.targetRid} != null ? ' ' + ${e.targetRid} : '')">USER</td>
          <td class="muted" th:text="${e.detail}">—</td>
        </tr>
        <tr th:if="${table.page.totalElements == 0}">
          <td colspan="5" class="muted">No audit entries match.</td>
        </tr>
      </tbody>
    </table>

    <div th:replace="~{admin/fragments :: dtPager(${table})}"></div>
    <div th:replace="~{admin/fragments :: footer}"></div>
  </main>
</div>
</body>
</html>
