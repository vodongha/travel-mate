name: CI

# Build + full test suite (unit + integration) against a throwaway Oracle Free instance.
on:
  push:
    branches: [develop]
  # PRs into develop (incl. Dependabot updates) and the release PR into master.
  pull_request:
    branches: [develop, master]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      oracle:
        image: gvenzl/oracle-free:slim-faststart
        env:
          ORACLE_PASSWORD: test
          APP_USER: test
          APP_USER_PASSWORD: test
        ports:
          - 1521:1521
        options: >-
          --health-cmd "healthcheck.sh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 40

    env:
      # AbstractIntegrationTest reads these (defaults point at a local compose DB).
      IT_DB_URL: jdbc:oracle:thin:@localhost:1521/FREEPDB1
      IT_DB_USERNAME: test
      IT_DB_PASSWORD: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build + test (mvn verify)
        run: mvn -B verify
