name: Deploy

# On a release to master: run the full test suite, then build the Flutter web client (from the
# private travel-mate-app repo) into ./web-dist and deploy the single-origin image to Fly.io.
# Also triggerable manually / from the app repo (workflow_dispatch) so an app-only release can
# redeploy the web without a backend change — see travel-mate-app .github/workflows/deploy-web.yml.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  verify:
    name: Test (mvn verify)
    runs-on: ubuntu-latest
    services:
      oracle:
        image: gvenzl/oracle-free:slim-faststart
        env:
          ORACLE_PASSWORD: test
          APP_USER: test
          APP_USER_PASSWORD: test
        ports:
          - 1521:1521
        options: >-
          --health-cmd "healthcheck.sh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 40
    env:
      IT_DB_URL: jdbc:oracle:thin:@localhost:1521/FREEPDB1
      IT_DB_USERNAME: test
      IT_DB_PASSWORD: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify

  deploy:
    name: Deploy to home server
    needs: [verify]
    runs-on: ubuntu-latest
    concurrency: deploy-group # prevent overlapping deploys
    steps:
      - name: Trigger home-server deploy (Cloudflare Tunnel webhook)
        run: |
          curl -fsS --max-time 30 -X POST https://hooks.vodongha.id.vn/deploy/travel-mate \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}"
