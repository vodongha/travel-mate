version: 2
updates:
  # Maven dependencies (pom.xml) — weekly, grouped into one PR to keep the noise down.
  - package-ecosystem: "maven"
    directory: "/"
    # Updates go to develop (master is release-only); they ride the next develop -> master release.
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Major framework bumps (e.g. Spring Boot 3 -> 4) are breaking and must be done by hand, not in
    # a grouped auto-merge — they broke the build once already.
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springframework:*"
        update-types: ["version-update:semver-major"]
    groups:
      maven-deps:
        patterns: ["*"]
  # Keep the GitHub Actions used by CI/CD up to date too.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
